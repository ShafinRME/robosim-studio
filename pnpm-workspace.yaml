packages:
  - "apps/*"
  - "packages/*"

# Only these dependencies may run install scripts (same list as RoboSim).
allowBuilds:
  esbuild: true
  msw: false
  sharp: true
  unrs-resolver: true

# Supply-chain protection: never install a version published less than 3 days ago
# (most malicious releases are found and removed within hours).
minimumReleaseAge: 4320

# Security overrides for vulnerable transitive dev-tool dependencies (see SECURITY.md).
# Remove each one when the parent package ships the fixed version itself.
overrides:
  "eslint-plugin-react-hooks>zod": "^4.6.6" # GHSA (high) in zod 3.x; plugin supports zod 4
  "@ts-morph/common>minimatch": "^11.0.1" # GHSA (moderate) ReDoS in minimatch 10.x (shadcn CLI)
