<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16263f"/><stop offset="1" stop-color="#080d17"/></linearGradient>
    <linearGradient id="arm" x1="16" y1="54" x2="50" y2="10" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#2a6dff"/><stop offset="1" stop-color="#40e8f2"/></linearGradient>
    <radialGradient id="orb" cx="0.38" cy="0.32" r="0.75"><stop offset="0" stop-color="#ffffff"/><stop offset="0.3" stop-color="#9ff7fb"/><stop offset="1" stop-color="#11a9c4"/></radialGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#40e8f2" stop-opacity="0.5"/><stop offset="1" stop-color="#40e8f2" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="0.55" fill="#a8bde0" fill-opacity="0.15"/></pattern>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#tile)"/>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#grid)"/>
  <rect x="2.6" y="2.6" width="58.8" height="58.8" rx="14.4" fill="none" stroke="#fff" stroke-opacity="0.12" stroke-width="1.2"/>
  <g transform="translate(2.5 0)">
    <ellipse cx="26" cy="55" rx="15" ry="2" fill="#000" fill-opacity="0.4"/>
    <rect x="14" y="50.5" width="24" height="4.6" rx="2.3" fill="url(#arm)"/>
    <path d="M20 51 22 43h8l2 8z" fill="url(#arm)" stroke="url(#arm)" stroke-width="2" stroke-linejoin="round"/>
    <g fill="none" stroke="url(#arm)" stroke-linecap="round">
      <path d="M26 41.5 19.5 22.5" stroke-width="8.4"/>
      <path d="M19.5 22.5 40.5 14.5" stroke-width="6.6"/>
      <path d="M40.5 14.5 45.5 20.5" stroke-width="5"/>
      <!-- parallel two-finger gripper -->
      <path d="M42.4 23.4 49.3 17.6" stroke-width="2.6"/>
      <path d="M42.4 23.4 45.6 27.2M49.3 17.6 52.5 21.4" stroke-width="2.6"/>
    </g>
    <!-- highlight strokes for depth -->
    <g fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-linecap="round" stroke-width="1.1">
      <path d="M23.4 39.2 17.9 23.4"/>
      <path d="M21.6 19.9 38.8 13.3"/>
    </g>
    <!-- simulated object in the gripper, with an orbit -->
    <circle cx="50.6" cy="26.2" r="9" fill="url(#halo)"/>
    <ellipse cx="50.6" cy="26.2" rx="7.4" ry="2.6" transform="rotate(-28 50.6 26.2)" fill="none" stroke="#40e8f2" stroke-opacity="0.55" stroke-width="0.9"/>
    <circle cx="50.6" cy="26.2" r="3.7" fill="url(#orb)"/>
    <!-- copper joints -->
    <circle cx="26" cy="41.5" r="5.2" fill="#f59e4b"/><circle cx="26" cy="41.5" r="1.9" fill="#0c1524"/>
    <circle cx="19.5" cy="22.5" r="4.3" fill="#f59e4b"/><circle cx="19.5" cy="22.5" r="1.55" fill="#0c1524"/>
    <circle cx="40.5" cy="14.5" r="3.4" fill="#f59e4b"/><circle cx="40.5" cy="14.5" r="1.2" fill="#0c1524"/>
  </g>
</svg>
